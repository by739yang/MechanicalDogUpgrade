; ============================================================================
;  MechanicalDogUpgrade / firmware  --  P0 (ESP-IDF C migration)
;  Goal: serial log + I2C scan + PCA9685 single-channel control
;
;  NOTE: keep this file PURE ASCII as well (same locale-encoding hazard as
;  sdkconfig.defaults). Chinese notes live in README.md instead.
;
;  Why espressif32@6.5.0 is pinned:
;    The local ~/.platformio/packages/framework-espidf is ESP-IDF v5.1.2,
;    which corresponds to espressif32@6.5.0. Pinning makes the build
;    reproducible and avoids downloading another framework copy.
;    WARNING: IDF 5.1.2 has no new-style driver/i2c_master.h (added in 5.2),
;    therefore this project uses the legacy driver/i2c.h API.
;
;  Hardware baseline (measured 2026-09-19):
;    - single I2C bus: SDA=GPIO21, SCL=GPIO22, 100 kHz
;    - PCA9685 left 0x40, right 0x41 (0x70 is the all-call broadcast address)
;    - no IMU is present on the board
; ============================================================================

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = espidf

; Custom partition table: the board has 4 MB of flash, but the ESP-IDF default
; gives the app only 1 MB.  With WiFi + HTTP + lwIP + mbedtls linked in (P5) the
; image reached 92.9% of 1 MB, leaving ~74 KB -- not enough for P6.  nvs keeps
; its 0x9000/0x6000 offset, so settings already on the board survive this change.
; See partitions.csv for the full reasoning (including why there is no OTA slot).
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -I src
    -I src/bsp
    -I src/drivers
    -I src/app

monitor_filters = esp32_exception_decoder, time

; Do not turn warnings into errors (legacy I2C is flagged deprecated in IDF 5.1)
build_unflags = -Werror
